name: Radkleidung vor Schichtbeginn

on:
  schedule:
    - cron: '*/30 * * * *'   # alle 30 min prüfen, ob eine Schicht bald beginnt
  workflow_dispatch:
    inputs:
      test:
        description: 'Sofort eine Test-Nachricht schicken'
        type: boolean
        default: true

concurrency: radkleidung

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Schichtplan prüfen und ggf. Push senden
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test && '1' || '' }}
        run: node benachrichtigung/senden.js
